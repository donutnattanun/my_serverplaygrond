
services:
  # Redis (shared between Rust & Go)
  redis:
    image: redis:7-alpine
    container_name: redis_shared
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
  # PostgreSQL (Rust only)
  postgres:
    image: postgres:15
    container_name: pg_core
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
  # Rust Core API (Auth / Policy / Master)
  rust-core:
    build:
      context: ./core-rust
      dockerfile: DockerFile
    env_file: 
      - ./core-rust/.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: 
      unless-stopped
  db-seed:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./core-rust/master.phc:/tmp/master.phc:ro
    environment:
      PGPASSWORD: mypass
    command: >
      bash -lc '
        HASH=$(cat /tmp/master.phc);
        until pg_isready -h postgres -U myuser -d mydb; do sleep 1; done;
        psql -h postgres -U myuser -d mydb -v "ON_ERROR_STOP=1" -c "
          INSERT INTO users (id, username, email, password_hash, role, status)
          VALUES (
            '\''8c060d6f-fa95-4957-8493-8cea14c94ebd'\'',
            '\''master'\'',
            '\''master@example.com'\'',
            '\''$${HASH}'\'',
            '\''master'\'',
            '\''active'\''
          )
          ON CONFLICT (id) DO NOTHING;
        "
      '
    restart: "no"
