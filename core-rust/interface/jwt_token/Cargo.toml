[package]
name = "jwt_token"
version = "0.1.0"
edition.workspace = true

[dependencies]
async-trait.workspace = true
model = { version = "0.1.0", path = "../../domain/model" }
use_case = { version = "0.1.0", path = "../../domain/use_case" }
serde = { version = "1", features = ["derive"] }
jsonwebtoken = { version = "10.1", default-features = false, features = [
  "rust_crypto",
  "use_pem",
] }
timesystem = { version = "0.1.0", path = "../timesystem" }
[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core", "pem"] }
#rand = "0.8"
#tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rand_core = "0.6.4"
tokio.workspace = true
uuid.workspace = true
timesystem = { version = "0.1.0", path = "../timesystem" }
