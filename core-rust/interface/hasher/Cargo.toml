[package]
name = "hasher"
version = "0.1.0"
edition.workspace = true

[dependencies]
argon2 = { version = "*", features = ["std", "password-hash"] }
async-trait.workspace = true
model = { version = "0.1.0", path = "../../domain/model" }
rand_core = { version = "*", features = ["getrandom"] }
use_case = { version = "0.1.0", path = "../../domain/use_case" }
base64 = "0.22.1"
hmac = "0.12.1"
rand = "0.9.2"
sha2 = "0.10.9"
subtle = "2.6.1"
zeroize = "1.8.2"
[dev-dependencies]
tokio.workspace = true
