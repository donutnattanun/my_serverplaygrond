[workspace]
resolver = "2"
members = [
  "application/app_service",
  "domain/model",
  "domain/service",
  "domain/use_case",
  "infrastructure/cashing",
  "infrastructure/postgre_db",
  "infrastructure/rest_api",
  "interface/hasher",
  "interface/jwt_token",
  "interface/policy_ver",
  "interface/refresh_token",
  "interface/timesystem",
  "utils/load_env",
  "utils/log",
]
[workspace.package]
edition = "2024"

[workspace.dependencies]
axum = { version = "0.8.4", features = ["macros"] }
dotenvy = "0.15.7"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.46.1", features = ["full"] }
sqlx = { version = "0.8.6", features = [
  "runtime-tokio-rustls",
  "postgres",
  "uuid",
  "macros",
  "chrono",
  "tls-rustls-ring-native-roots",
] }
uuid = { version = "1.17.0", features = ["v4", "serde", "fast-rng"] }
async-trait = "0.1.88"
thiserror = "2.0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.6.6", features = ["cors"] }
http = "1.3.1"
